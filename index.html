
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage your student records easily</p>
    </header>

    <main>
        
<section class="stats-container">

    <div class="stat-card">
        <h3>Total Students</h3>
        <p id="total-stat">0</p>
    </div>

    <div class="stat-card">
        <h3>Total Courses</h3>
        <p id="course-stat">0</p>
    </div>

    <div class="stat-card">
        <h3>Latest Student</h3>
        <p id="latest-stat">None</p>
    </div>

</section>

        <section class="card">
            <h2 id="form-title">Add New Student</h2>

            <form id="student-form">
                <input type="text" id="name" placeholder="Student Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="text" id="course" placeholder="Course Name" required>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Add Student</button>
                    <button type="button" id="cancel-btn" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Student Records</h2>
            <input type="search" id="search" placeholder="Search students...">
            
<select id="course-filter">
    <option value="">All Courses</option>
    <option value="BCA">BCA</option>
    <option value="MCA">MCA</option>
    <option value="BBA">BBA</option>
    <option value="MBA">MBA</option>
    <option value="B.Tech">B.Tech</option>
</select>

            
<button type="button" id="export-btn" class="export-btn">
    Download Student Records
</button>


            <p id="student-count">Total Students: 0</p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-list"></tbody>
                </table>
            </div>

            <p id="empty-message">No students added yet.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
